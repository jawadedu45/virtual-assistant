<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jawad's Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #0F3D3E;
    --teal-dark: #0A2B2C;
    --sand: #F6F1E9;
    --coral: #FF6B4A;
    --text-dark: #1E2B2B;
    --text-light: #FFFFFF;
    --bubble-bot: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--sand);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .chat-widget {
    width: 380px;
    height: 600px;
    background: var(--sand);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(15, 61, 62, 0.25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    background: var(--teal);
    color: var(--text-light);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .chat-header .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--coral);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
  }
  .chat-header h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  .chat-header p {
    margin: 0;
    font-size: 12px;
    opacity: 0.75;
  }
  .chat-messages {
    flex: 1;
    padding: 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.45;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--coral);
    color: var(--text-light);
    border-radius: 16px 16px 4px 16px;
  }
  .bubble.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--text-dark);
    border-radius: 16px 16px 16px 4px;
    box-shadow: 0 2px 6px rgba(15, 61, 62, 0.08);
  }
  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: var(--bubble-bot);
    border-radius: 16px 16px 16px 4px;
    box-shadow: 0 2px 6px rgba(15, 61, 62, 0.08);
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--teal);
    opacity: 0.4;
    animation: breathe 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes breathe {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }
  .chat-input {
    display: flex;
    gap: 8px;
    padding: 14px;
    background: var(--sand);
    border-top: 1px solid rgba(15, 61, 62, 0.1);
  }
  .chat-input input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid rgba(15, 61, 62, 0.15);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .chat-input input:focus {
    border-color: var(--coral);
  }
  .chat-input button {
    background: var(--teal);
    color: var(--text-light);
    border: none;
    border-radius: 20px;
    padding: 0 18px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    cursor: pointer;
  }
  .chat-input button:hover {
    background: var(--teal-dark);
  }
</style>
</head>
<body>

<div class="chat-widget">
  <div class="chat-header">
    <div class="avatar">J</div>
    <div>
      <h1>Jawad's Assistant</h1>
      <p>Usually replies instantly</p>
    </div>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="bubble bot">Hey! I'm Jawad's assistant. What can I help with?</div>
  </div>

  <div class="chat-input">
    <input type="text" id="user-input" placeholder="Type a message...">
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
  const API_KEY = 'jawad-assistant-secret-2026';

  const messagesEl = document.getElementById('chat-messages');
  const inputEl = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const nameEl = document.querySelector('.chat-header h1');

  function addBubble(text, sender) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + sender;
    bubble.textContent = text;
    messagesEl.appendChild(bubble);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.id = 'typing-indicator';
    typing.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(typing);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const typing = document.getElementById('typing-indicator');
    if (typing) typing.remove();
  }

  async function loadSettings() {
    try {
      const response = await fetch('http://127.0.0.1:8000/settings');
      const data = await response.json();
      nameEl.textContent = data.assistant_name;
      messagesEl.innerHTML = '';
      addBubble(data.greeting, 'bot');
    } catch (error) {
      console.error('Could not load settings:', error);
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addBubble(text, 'user');
    inputEl.value = '';
    showTyping();

    try {
      const response = await fetch('http://127.0.0.1:8000/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-API-Key': API_KEY
        },
        body: JSON.stringify({ message: text })
      });
      const data = await response.json();
      hideTyping();
      addBubble(data.reply, 'bot');
    } catch (error) {
      hideTyping();
      addBubble("Sorry, I couldn't connect right now.", 'bot');
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  loadSettings();
</script>

</body>
</html>
