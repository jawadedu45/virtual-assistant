<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Khyber AI — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #0F3D3E;
    --teal-dark: #0A2B2C;
    --sand: #F6F1E9;
    --coral: #FF6B4A;
    --text-dark: #1E2B2B;
    --text-light: #FFFFFF;
    --card: #FFFFFF;
    --border: rgba(15, 61, 62, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--sand);
    font-family: 'Inter', sans-serif;
    color: var(--text-dark);
  }
  header {
    background: var(--teal);
    color: var(--text-light);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 18px;
    margin: 0;
  }
  #lock-screen {
    max-width: 360px;
    margin: 100px auto;
    background: var(--card);
    padding: 28px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(15,61,62,0.12);
    text-align: center;
  }
  #lock-screen input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin: 14px 0;
    font-size: 14px;
  }
  #lock-screen button, .btn {
    background: var(--teal);
    color: var(--text-light);
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  #lock-screen button:hover, .btn:hover { background: var(--teal-dark); }
  .btn.danger { background: #c0392b; }
  .btn.danger:hover { background: #a5301f; }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  #error-msg { color: #c0392b; font-size: 13px; min-height: 18px; }

  main { display: none; max-width: 1100px; margin: 0 auto; padding: 24px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    padding: 10px 18px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    background: transparent;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    color: var(--text-dark);
    opacity: 0.6;
  }
  .tab.active { background: var(--card); opacity: 1; box-shadow: 0 -2px 6px rgba(15,61,62,0.06); }
  .panel { display: none; background: var(--card); border-radius: 0 12px 12px 12px; padding: 22px; box-shadow: 0 4px 20px rgba(15,61,62,0.06); }
  .panel.active { display: block; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-weight: 600; opacity: 0.7; font-size: 12px; text-transform: uppercase; letter-spacing: 0.02em; }
  tr:hover { background: rgba(15,61,62,0.03); }

  .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .form-grid input { padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13.5px; font-family: 'Inter', sans-serif; }
  .form-grid input:focus { outline: none; border-color: var(--coral); }
  .section-title { font-family: 'Poppins', sans-serif; font-size: 15px; margin: 0 0 14px 0; }
  .empty-note { opacity: 0.6; font-size: 13.5px; padding: 20px 0; text-align: center; }

  .messages-view { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
  .msg-line { padding: 6px 0; font-size: 13.5px; }
  .msg-line b { color: var(--teal); }
  .close-link { font-size: 12.5px; color: var(--coral); cursor: pointer; }
  .stock-low { color: #c0392b; font-weight: 600; }
</style>
</head>
<body>

<div id="lock-screen">
  <h2 style="font-family:'Poppins',sans-serif;">Admin Login</h2>
  <p style="font-size:13.5px; opacity:0.7;">Enter your admin key to continue.</p>
  <input type="password" id="key-input" placeholder="Admin API key">
  <div id="error-msg"></div>
  <button onclick="tryLogin()">Enter</button>
</div>

<header id="app-header" style="display:none;">
  <h1>Khyber AI — Admin</h1>
  <button class="btn small" onclick="logout()">Log out</button>
</header>

<main id="app-main">
  <div class="tabs">
    <button class="tab active" data-tab="products" onclick="switchTab('products')">Products</button>
    <button class="tab" data-tab="conversations" onclick="switchTab('conversations')">Conversations</button>
    <button class="tab" data-tab="customers" onclick="switchTab('customers')">Customers</button>
  </div>

  <div class="panel active" id="panel-products">
    <h3 class="section-title">Add a product</h3>
    <div class="form-grid">
      <input id="p-name" placeholder="Product name*">
      <input id="p-category" placeholder="Category">
      <input id="p-price" placeholder="Price" type="number">
      <input id="p-currency" placeholder="Currency" value="PKR">
      <input id="p-color" placeholder="Color">
      <input id="p-size" placeholder="Size">
      <input id="p-stock" placeholder="Stock" type="number" value="0">
      <input id="p-keywords" placeholder="Keywords (comma-separated)">
      <input id="p-video" placeholder="Video filename (in /videos)">
    </div>
    <button class="btn" onclick="addProduct()">Add Product</button>
    <div id="error-msg-products" style="color:#c0392b; font-size:13px; margin-top:8px;"></div>

    <h3 class="section-title" style="margin-top:26px;">Catalog</h3>
    <table id="products-table">
      <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Color</th><th>Stock</th><th>Keywords</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty-note" id="products-empty" style="display:none;">No products yet — add one above.</div>
  </div>

  <div class="panel" id="panel-conversations">
    <h3 class="section-title">Recent conversations</h3>
    <table id="conversations-table">
      <thead><tr><th>Customer</th><th>Started</th><th>Last activity</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty-note" id="conversations-empty" style="display:none;">No conversations yet.</div>
    <div class="messages-view" id="messages-view" style="display:none;">
      <span class="close-link" onclick="closeMessages()">✕ close</span>
      <div id="messages-list"></div>
    </div>
  </div>

  <div class="panel" id="panel-customers">
    <h3 class="section-title">Customers</h3>
    <table id="customers-table">
      <thead><tr><th>User ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty-note" id="customers-empty" style="display:none;">No customers yet.</div>
  </div>
</main>

<script>
  let ADMIN_KEY = '';

  function tryLogin() {
    const key = document.getElementById('key-input').value.trim();
    if (!key) return;
    ADMIN_KEY = key;
    fetch('/admin/products', { headers: { 'X-API-Key': ADMIN_KEY } })
      .then(r => {
        if (r.status === 401) {
          document.getElementById('error-msg').textContent = 'Incorrect key.';
          ADMIN_KEY = '';
          return;
        }
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('app-header').style.display = 'flex';
        document.getElementById('app-main').style.display = 'block';
        loadProducts();
        loadConversations();
        loadCustomers();
      })
      .catch(() => {
        document.getElementById('error-msg').textContent = 'Could not connect to server.';
      });
  }

  function logout() {
    ADMIN_KEY = '';
    document.getElementById('lock-screen').style.display = 'block';
    document.getElementById('app-header').style.display = 'none';
    document.getElementById('app-main').style.display = 'none';
    document.getElementById('key-input').value = '';
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
  }

  async function adminFetch(url, options = {}) {
    options.headers = Object.assign({ 'X-API-Key': ADMIN_KEY, 'Content-Type': 'application/json' }, options.headers || {});
    const res = await fetch(url, options);
    if (res.status === 401) { logout(); throw new Error('Session expired'); }
    if (!res.ok) throw new Error('Request failed: ' + res.status);
    return res.json();
  }

  // --- Products ---
  async function loadProducts() {
    try {
      const products = await adminFetch('/admin/products');
      const tbody = document.querySelector('#products-table tbody');
      tbody.innerHTML = '';
      document.getElementById('products-empty').style.display = products.length ? 'none' : 'block';
      for (const p of products) {
        const tr = document.createElement('tr');
        const stockClass = p.stock <= 0 ? 'stock-low' : '';
        tr.innerHTML = `
          <td>${escapeHtml(p.product_name)}</td>
          <td>${escapeHtml(p.category || '—')}</td>
          <td>${p.price != null ? p.price + ' ' + p.currency : '—'}</td>
          <td>${escapeHtml(p.color || '—')}</td>
          <td class="${stockClass}">${p.stock}</td>
          <td>${escapeHtml(p.keywords || '—')}</td>
          <td><button class="btn small danger" data-id="${p.product_id}">Delete</button></td>
        `;
        tr.querySelector('button').addEventListener('click', () => deleteProduct(p.product_id));
        tbody.appendChild(tr);
      }
    } catch (e) {
      console.error(e);
    }
  }

  async function addProduct() {
    const name = document.getElementById('p-name').value.trim();
    const errEl = document.getElementById('error-msg-products');
    errEl.textContent = '';
    if (!name) { errEl.textContent = 'Product name is required.'; return; }

    const payload = {
      product_name: name,
      category: document.getElementById('p-category').value.trim() || null,
      price: parseFloat(document.getElementById('p-price').value) || null,
      currency: document.getElementById('p-currency').value.trim() || 'PKR',
      color: document.getElementById('p-color').value.trim() || null,
      size: document.getElementById('p-size').value.trim() || null,
      stock: parseInt(document.getElementById('p-stock').value) || 0,
      keywords: document.getElementById('p-keywords').value.trim() || '',
      video_url: document.getElementById('p-video').value.trim() || null,
    };

    try {
      await adminFetch('/admin/products', { method: 'POST', body: JSON.stringify(payload) });
      ['p-name','p-category','p-price','p-color','p-size','p-keywords','p-video'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('p-stock').value = '0';
      document.getElementById('p-currency').value = 'PKR';
      loadProducts();
    } catch (e) {
      errEl.textContent = 'Could not add product. Please try again.';
    }
  }

  async function deleteProduct(id) {
    if (!confirm('Delete this product?')) return;
    try {
      await adminFetch('/admin/products/' + id, { method: 'DELETE' });
      loadProducts();
    } catch (e) {
      alert('Could not delete product.');
    }
  }

  // --- Conversations ---
  async function loadConversations() {
    try {
      const convos = await adminFetch('/admin/conversations');
      const tbody = document.querySelector('#conversations-table tbody');
      tbody.innerHTML = '';
      document.getElementById('conversations-empty').style.display = convos.length ? 'none' : 'block';
      for (const c of convos) {
        const tr = document.createElement('tr');
        const label = c.customer_name || c.email || c.phone || c.user_id;
        tr.innerHTML = `
          <td>${escapeHtml(label)}</td>
          <td>${formatDate(c.created_at)}</td>
          <td>${formatDate(c.updated_at)}</td>
          <td><button class="btn small">View</button></td>
        `;
        tr.querySelector('button').addEventListener('click', () => viewMessages(c.conversation_id));
        tbody.appendChild(tr);
      }
    } catch (e) {
      console.error(e);
    }
  }

  async function viewMessages(conversationId) {
    try {
      const messages = await adminFetch(`/admin/conversations/${conversationId}/messages`);
      const list = document.getElementById('messages-list');
      list.innerHTML = messages.map(m =>
        `<div class="msg-line"><b>${m.sender}</b> (${m.message_type}): ${escapeHtml(m.message)}</div>`
      ).join('') || '<div class="empty-note">No messages.</div>';
      document.getElementById('messages-view').style.display = 'block';
    } catch (e) {
      alert('Could not load messages.');
    }
  }

  function closeMessages() {
    document.getElementById('messages-view').style.display = 'none';
  }

  // --- Customers ---
  async function loadCustomers() {
    try {
      const customers = await adminFetch('/admin/customers');
      const tbody = document.querySelector('#customers-table tbody');
      tbody.innerHTML = '';
      document.getElementById('customers-empty').style.display = customers.length ? 'none' : 'block';
      for (const c of customers) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-size:11.5px; opacity:0.7;">${escapeHtml(c.user_id)}</td>
          <td>${escapeHtml(c.name || '—')}</td>
          <td>${escapeHtml(c.email || '—')}</td>
          <td>${escapeHtml(c.phone || '—')}</td>
          <td>${formatDate(c.created_at)}</td>
        `;
        tbody.appendChild(tr);
      }
    } catch (e) {
      console.error(e);
    }
  }

  function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleString();
  }

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  document.getElementById('key-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
  });
</script>

</body>
</html>
